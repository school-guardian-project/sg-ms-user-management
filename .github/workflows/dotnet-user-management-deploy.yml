name: Deploy User Management

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  call-dotnet-workflow:
    uses: school-guardian-project/.github/.github/workflows/deploy-dotnet.yml@main
    with:
      dockerfile_path: 'src/ms-user-management.Api/Dockerfile'
      app_name: 'user-management-app'
      host_port: 8080
    secrets: inherit
